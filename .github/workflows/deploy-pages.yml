name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: windows-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.3xx'

      - uses: actions/configure-pages@v5

      - name: Publish production site
        run: dotnet publish src\YugiohLookUp.Web -c Release -o artifacts\publish

      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts\publish\wwwroot

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4